<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sun's Path · Slangerup & Bottmingen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#080c1a; --night-2:#0d1226; --panel:#111832; --line:#20294a;
    --ink:#eaeefb; --muted:#828fb4; --faint:#5a6488;
    --dawn:#ffb454; --dusk:#ec6a8e; --day:#ffd98a; --twilight:#3a4a86; --ice:#79dcff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 78% -10%, #17204a 0%, transparent 55%),
      radial-gradient(900px 600px at 5% 110%, #1a1330 0%, transparent 50%),
      var(--night);
    color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100%;
    display:flex;justify-content:center; padding:clamp(16px,4vw,48px);
  }
  .wrap{width:100%;max-width:980px}
  header{margin-bottom:26px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--dawn);box-shadow:0 0 10px var(--dawn)}
  h1{font-family:'Fraunces',serif;font-weight:500;font-optical-sizing:auto;
    font-size:clamp(38px,7vw,66px);line-height:.98;letter-spacing:-.02em;margin:.18em 0 0}
  h1 em{font-style:italic;font-weight:400;color:var(--dawn)}

  .datebar{display:flex;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
  .datebar label{font-size:13px;color:var(--muted)}
  input[type=date]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-family:'JetBrains Mono',monospace;font-size:14px;color-scheme:dark;cursor:pointer}
  input[type=date]:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
  .today-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:10px;
    padding:9px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:border-color .2s,color .2s}
  .today-btn:hover{border-color:var(--dawn);color:var(--ink)}
  .today-btn:focus-visible{outline:2px solid var(--ice);outline-offset:2px}

  .compare{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);
    margin:22px 2px 20px;line-height:1.5}
  .compare b{color:var(--ink);font-weight:500}
  .compare .accent{color:var(--dawn)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{background:linear-gradient(180deg,var(--night-2),#0a1024);border:1px solid var(--line);
    border-radius:18px;padding:24px 24px 22px}
  .city{font-family:'Fraunces',serif;font-weight:500;font-size:26px;letter-spacing:-.01em}
  .place{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-top:4px}

  .rs{display:flex;gap:26px;margin:22px 0 18px}
  .rs .cell{flex:1}
  .rs .k{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);display:flex;align-items:center;gap:7px}
  .rs .k::before{content:"";width:7px;height:7px;border-radius:50%;flex:none}
  .rs .rise .k::before{background:var(--dawn);box-shadow:0 0 8px var(--dawn)}
  .rs .set  .k::before{background:var(--dusk);box-shadow:0 0 8px var(--dusk)}
  .rs .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:clamp(28px,4.6vw,38px);
    margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

  /* daylight bar */
  .bar{position:relative;height:16px;border-radius:8px;overflow:hidden;background:#070b18;
    border:1px solid var(--line);margin-top:6px}
  .bar .twi{position:absolute;top:0;bottom:0;background:rgba(58,74,134,0.55)}
  .bar .day{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#ffb454,#ffd98a,#f4728e)}
  .ticks{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;
    font-size:10px;color:var(--faint);margin-top:6px}
  .len-line{display:flex;align-items:baseline;gap:8px;margin-top:16px}
  .len-line .lab{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--muted)}
  .len-line .val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--day)}

  .sub{display:flex;gap:20px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;
    font-size:11.5px;color:var(--muted);margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .sub b{color:var(--ink);font-weight:500}

  footer{margin-top:26px;font-size:12px;line-height:1.65;color:var(--faint);max-width:66ch}
  footer .muted{color:var(--muted)}

  @media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span class="dot"></span> Two locations · Central European Time</div>
    <h1>The sun's <em>path</em></h1>
    <div class="datebar">
      <label for="d">Date</label>
      <input type="date" id="d">
      <button class="today-btn" id="today">Today</button>
    </div>
  </header>

  <div class="compare" id="compare">—</div>

  <div class="grid">
    <div class="card" data-city="slangerup">
      <div class="city">Slangerup</div>
      <div class="place">Denmark · 55.84° N · 12.18° E</div>
      <div class="rs">
        <div class="cell rise"><div class="k">Sunrise</div><div class="v" data-f="rise">—</div></div>
        <div class="cell set"><div class="k">Sunset</div><div class="v" data-f="set">—</div></div>
      </div>
      <div class="bar"><div class="twi" data-f="twi"></div><div class="day" data-f="day"></div></div>
      <div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
      <div class="len-line"><span class="lab">Day length</span><span class="val" data-f="len">—</span></div>
      <div class="sub">
        
        <div>Civil dawn <b data-f="cdawn">—</b></div>
        <div>Civil dusk <b data-f="cdusk">—</b></div>
      </div>
    </div>

    <div class="card" data-city="bottmingen">
      <div class="city">Bottmingen</div>
      <div class="place">Switzerland · 47.54° N · 7.59° E</div>
      <div class="rs">
        <div class="cell rise"><div class="k">Sunrise</div><div class="v" data-f="rise">—</div></div>
        <div class="cell set"><div class="k">Sunset</div><div class="v" data-f="set">—</div></div>
      </div>
      <div class="bar"><div class="twi" data-f="twi"></div><div class="day" data-f="day"></div></div>
      <div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
      <div class="len-line"><span class="lab">Day length</span><span class="val" data-f="len">—</span></div>
      <div class="sub">
        
        <div>Civil dawn <b data-f="cdawn">—</b></div>
        <div>Civil dusk <b data-f="cdusk">—</b></div>
      </div>
    </div>
  </div>

</div>

<script>
const rad=Math.PI/180, deg=180/Math.PI;
const CITIES={
  slangerup:{name:'Slangerup',lat:55.844,lon:12.183},
  bottmingen:{name:'Bottmingen',lat:47.538,lon:7.586}
};

function julianDay(y,m,d){ if(m<=2){y-=1;m+=12;} const A=Math.floor(y/100); const B=2-A+Math.floor(A/4); return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5; }
function calcSun(jd){
  const T=(jd-2451545.0)/36525.0;
  const L0=((280.46646+T*(36000.76983+T*0.0003032))%360+360)%360;
  const M=357.52911+T*(35999.05029-0.0001537*T);
  const e=0.016708634-T*(0.000042037+0.0000001267*T);
  const Mr=M*rad;
  const C=Math.sin(Mr)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*Mr)*(0.019993-0.000101*T)+Math.sin(3*Mr)*0.000289;
  const trueLong=L0+C, omega=125.04-1934.136*T;
  const lambda=trueLong-0.00569-0.00478*Math.sin(omega*rad);
  const eps0=23+(26+((21.448-T*(46.815+T*(0.00059-T*0.001813))))/60)/60;
  const eps=eps0+0.00256*Math.cos(omega*rad);
  const decl=Math.asin(Math.sin(eps*rad)*Math.sin(lambda*rad))*deg;
  const yy=Math.tan(eps/2*rad)**2, L0r=L0*rad;
  const Eq=4*deg*(yy*Math.sin(2*L0r)-2*e*Math.sin(Mr)+4*e*yy*Math.sin(Mr)*Math.cos(2*L0r)-0.5*yy*yy*Math.sin(4*L0r)-1.25*e*e*Math.sin(2*Mr));
  return {decl,Eq};
}
function lastSunday(y,monthIdx0){ const d=new Date(Date.UTC(y,monthIdx0+1,0)); d.setUTCDate(d.getUTCDate()-d.getUTCDay()); return d; }
function offsetMin(y,m,d){ const t=Date.UTC(y,m-1,d,1,0,0); const s=lastSunday(y,2).getTime(),en=lastSunday(y,9).getTime(); return (t>=s&&t<en)?120:60; }
function events(y,m,d,h0,lat,lon){
  const off=offsetMin(y,m,d), jd=julianDay(y,m,d), {decl,Eq}=calcSun(jd+0.5);
  const cosH=(Math.sin(h0*rad)-Math.sin(lat*rad)*Math.sin(decl*rad))/(Math.cos(lat*rad)*Math.cos(decl*rad));
  const noon=720-4*lon-Eq+off;
  if(cosH>1) return {rise:null,set:null,noon,polar:'night',decl};
  if(cosH<-1) return {rise:null,set:null,noon,polar:'day',decl};
  const HA=Math.acos(cosH)*deg;
  return {rise:noon-4*HA,set:noon+4*HA,noon,decl};
}
const altAtNoon=(decl,lat)=>90-lat+decl;
function hm(min){ if(min==null) return '—'; min=((min%1440)+1440)%1440; const h=Math.floor(min/60); let mm=Math.round(min-h*60),hh=h; if(mm===60){mm=0;hh=(h+1)%24;} return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function dur(a,b){ if(a==null||b==null) return '—'; let t=b-a; const h=Math.floor(t/60),m=Math.round(t-h*60); return h+'h '+String(m).padStart(2,'0')+'m'; }
function durAbs(t){ const h=Math.floor(t/60),m=Math.round(t-h*60); return h+'h '+String(m).padStart(2,'0')+'m'; }

const $=id=>document.getElementById(id);
let sel=new Date();
const fmtISO=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const pct=min=>(Math.max(0,Math.min(1440,min))/1440*100);

function fillCity(cityKey){
  const c=CITIES[cityKey], card=document.querySelector('.card[data-city="'+cityKey+'"]');
  const y=sel.getFullYear(),m=sel.getMonth()+1,d=sel.getDate();
  const e=events(y,m,d,-0.833,c.lat,c.lon), civ=events(y,m,d,-6,c.lat,c.lon);
  const q=f=>card.querySelector('[data-f="'+f+'"]');
  q('rise').textContent=hm(e.rise);
  q('set').textContent=hm(e.set);
  q('len').textContent=(e.rise!=null&&e.set!=null)?dur(e.rise,e.set):'—';
  q('cdawn').textContent=hm(civ.rise);
  q('cdusk').textContent=hm(civ.set);
  // bars
  if(e.rise!=null&&e.set!=null){
    q('day').style.left=pct(e.rise)+'%'; q('day').style.width=(pct(e.set)-pct(e.rise))+'%';
  } else { q('day').style.width='0%'; }
  if(civ.rise!=null&&civ.set!=null){
    q('twi').style.left=pct(civ.rise)+'%'; q('twi').style.width=(pct(civ.set)-pct(civ.rise))+'%';
  } else { q('twi').style.width='0%'; }
  return e;
}

function render(){
  const eS=fillCity('slangerup'), eB=fillCity('bottmingen');
  // comparison
  const dateStr=sel.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  if(eS.rise!=null&&eB.rise!=null){
    const lenS=eS.set-eS.rise, lenB=eB.set-eB.rise, diff=lenS-lenB;
    if(Math.abs(diff)<1){
      $('compare').innerHTML='On <b>'+dateStr+'</b> both places have almost exactly the same day length — near an equinox.';
    } else {
      const more=diff>0?'Slangerup':'Bottmingen';
      $('compare').innerHTML='On <b>'+dateStr+'</b>, <span class="accent">'+more+'</span> has <b>'+durAbs(Math.abs(diff))+'</b> more daylight.';
    }
  } else { $('compare').textContent=dateStr; }
}

$('d').value=fmtISO(sel);
$('d').addEventListener('change',e=>{ const [y,m,d]=e.target.value.split('-').map(Number); if(!y)return; sel=new Date(y,m-1,d); render(); });
$('today').addEventListener('click',()=>{ sel=new Date(); $('d').value=fmtISO(sel); render(); });
render();
</script>
</body>
</html>
