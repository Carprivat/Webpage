<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avanceret Stikprøve-Beregner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-lg w-full border border-slate-100">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Statistisk Usikkerhed</h1>
            <p class="text-slate-500 mt-2">Beregnet med Wilson Score Interval for høj præcision</p>
        </div>
        
        <div class="space-y-6">
            <!-- Stikprøvestørrelse -->
            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider">Stikprøvens størrelse (n)</label>
                <input type="number" id="sampleSize" value="100" min="1" 
                    class="mt-2 block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all font-medium">
            </div>

            <!-- Sandsynlighed p -->
            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider">Observeret andel (%)</label>
                <div class="relative mt-2">
                    <input type="number" id="probability" value="2" min="0" max="100" step="0.1"
                        class="block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all font-medium">
                    <span class="absolute right-4 top-3.5 text-slate-400 font-bold">%</span>
                </div>
            </div>

            <!-- Konfidensniveau -->
            <div>
                <label class="block text-sm font-bold text-slate-700 uppercase tracking-wider">Konfidensinterval</label>
                <select id="confidenceLevel" 
                    class="mt-2 block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all font-medium cursor-pointer">
                    <option value="1.645">90% (Politisk standard)</option>
                    <option value="1.96" selected>95% (Videnskabelig standard)</option>
                    <option value="2.576">99% (Høj sikkerhed)</option>
                </select>
            </div>

            <!-- Beregn knap -->
            <button onclick="calculate()" 
                class="w-full bg-blue-600 text-white font-extrabold py-4 rounded-xl hover:bg-blue-700 active:scale-[0.97] transition-all shadow-lg shadow-blue-200 text-lg">
                Beregn konfidensinterval
            </button>
        </div>

        <!-- Resultat sektion -->
        <div id="resultBox" class="mt-10 hidden border-t pt-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="text-center">
                <p class="text-sm font-bold text-slate-400 uppercase tracking-widest mb-2">Konfidensinterval</p>
                <div class="inline-flex items-center justify-center space-x-4 bg-blue-50 px-6 py-4 rounded-2xl border border-blue-100">
                    <span class="text-3xl font-black text-blue-900" id="lowBound">0,00%</span>
                    <span class="text-slate-400 font-light text-2xl">—</span>
                    <span class="text-3xl font-black text-blue-900" id="highBound">0,00%</span>
                </div>
                <p class="text-sm text-slate-600 mt-4 leading-relaxed" id="explanationText"></p>
            </div>
            
            <div id="warningBox" class="mt-4 p-3 bg-amber-50 rounded-lg border border-amber-100 hidden">
                <p class="text-xs text-amber-700 text-center">
                    <strong>Bemærk:</strong> Ved små værdier af n*p er usikkerheden asymmetrisk. Wilson-metoden sikrer her, at intervallet ikke går under 0%.
                </p>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const n = parseFloat(document.getElementById('sampleSize').value);
            const pInput = parseFloat(document.getElementById('probability').value);
            const z = parseFloat(document.getElementById('confidenceLevel').value);
            
            const resultBox = document.getElementById('resultBox');
            const warningBox = document.getElementById('warningBox');
            const lowDisplay = document.getElementById('lowBound');
            const highDisplay = document.getElementById('highBound');
            const explanationText = document.getElementById('explanationText');

            if (n > 0 && pInput >= 0 && pInput <= 100) {
                const p = pInput / 100;
                
                // Wilson Score Interval Formel
                // Denne formel er mere robust end Wald (p +/- z*se) ved ekstreme p-værdier
                const z2 = z * z;
                const center = (p + z2 / (2 * n)) / (1 + z2 / n);
                const spread = (z * Math.sqrt((p * (1 - p) / n) + (z2 / (4 * n * n)))) / (1 + z2 / n);

                const low = Math.max(0, (center - spread) * 100);
                const high = Math.min(100, (center + spread) * 100);

                // Opdater UI
                lowDisplay.innerText = low.toFixed(2).replace('.', ',') + "%";
                highDisplay.innerText = high.toFixed(2).replace('.', ',') + "%";
                
                explanationText.innerHTML = `Med <strong>${document.getElementById('confidenceLevel').options[document.getElementById('confidenceLevel').selectedIndex].text.split(' ')[0]}</strong> sikkerhed ligger den sande værdi i populationen i dette interval.`;

                // Vis advarsel hvis n*p < 5
                if (n * p < 5 || n * (1 - p) < 5) {
                    warningBox.classList.remove('hidden');
                } else {
                    warningBox.classList.add('hidden');
                }

                resultBox.classList.remove('hidden');
            } else {
                alert("Indtast venligst gyldige værdier for stikprøve og andel.");
            }
        }
    </script>
</body>
</html>
