<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Låneberegner med rentefradrag</title>

<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #141e30, #243b55);
        color: white;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(18px);
        padding: 30px;
        border-radius: 20px;
        width: 380px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .input-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        opacity: 0.9;
    }

    input[type="range"] {
        width: 100%;
    }

    .value {
        text-align: right;
        font-weight: bold;
        font-size: 14px;
        margin-top: 4px;
    }

    .result {
        margin-top: 20px;
        padding: 15px;
        background: rgba(0,0,0,0.25);
        border-radius: 12px;
    }

    .result h2 {
        margin: 0;
        text-align: center;
    }

    .small {
        text-align: center;
        margin-top: 8px;
        font-size: 13px;
        opacity: 0.85;
    }
</style>
</head>

<body>

<div class="container">
    <h1>💰 Låneberegner</h1>

    <div class="input-group">
        <label>Beløb</label>
        <input type="range" id="amount" min="10000" max="1000000" step="10000" value="200000">
        <div class="value" id="amountValue"></div>
    </div>

    <div class="input-group">
        <label>Rente (%)</label>
        <input type="range" id="interest" min="0" max="10" step="0.1" value="3">
        <div class="value" id="interestValue"></div>
    </div>

    <div class="input-group">
        <label>Løbetid (år)</label>
        <input type="range" id="years" min="1" max="30" step="1" value="10">
        <div class="value" id="yearsValue"></div>
    </div>

    <div class="result">
        <h2 id="monthly"></h2>
        <div class="small" id="netMonthly"></div>
        <div class="small" id="taxBenefit"></div>
    </div>
</div>

<script>
const amount = document.getElementById("amount");
const interest = document.getElementById("interest");
const years = document.getElementById("years");

const amountValue = document.getElementById("amountValue");
const interestValue = document.getElementById("interestValue");
const yearsValue = document.getElementById("yearsValue");

const monthly = document.getElementById("monthly");
const netMonthly = document.getElementById("netMonthly");
const taxBenefit = document.getElementById("taxBenefit");

function formatDKK(n) {
    return n.toLocaleString("da-DK", {maximumFractionDigits: 0});
}

function calculate() {
    let P = parseFloat(amount.value);
    let annualRate = parseFloat(interest.value) / 100;
    let r = annualRate / 12;
    let n = parseFloat(years.value) * 12;

    amountValue.innerText = formatDKK(P) + " kr";
    interestValue.innerText = interest.value + " %";
    yearsValue.innerText = years.value + " år";

    let m;
    if (r === 0) {
        m = P / n;
    } else {
        m = P * r / (1 - Math.pow(1 + r, -n));
    }

    let totalInterestYearlyApprox = P * annualRate; // simpel approx
    let taxDeduction = totalInterestYearlyApprox * 0.33;
    let monthlyTaxBenefit = taxDeduction / 12;

    let netMonthlyPayment = m - monthlyTaxBenefit;

    monthly.innerText = formatDKK(m) + " kr / måned";
    netMonthly.innerText = "Efter rentefradrag: " + formatDKK(netMonthlyPayment) + " kr / måned";
    taxBenefit.innerText = "Skattefordel (ca.): -" + formatDKK(monthlyTaxBenefit) + " kr / måned";
}

amount.addEventListener("input", calculate);
interest.addEventListener("input", calculate);
years.addEventListener("input", calculate);

calculate();
</script>

</body>
</html>
